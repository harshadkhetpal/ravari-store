name: Build Frontend and Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.DEPLOY_PAT }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        CI=false npm run build
        cd ..

    - name: Commit and push build to both repos
      run: |
        git config user.email "ravari.store@gmail.com"
        git config user.name "RAVARI CI"
        git add frontend/build -f
        git diff --staged --quiet && echo "No build changes" || git commit -m "CI: rebuild luxury frontend [skip ci]"
        git push https://ravaristore-ux:${{ secrets.DEPLOY_PAT }}@github.com/ravaristore-ux/ravari_store.git HEAD:main
        git push https://ravaristore-ux:${{ secrets.DEPLOY_PAT }}@github.com/harshadkhetpal/ravari-store.git HEAD:main --force
